name: Bug report
description: Report a reproducible problem in ReMap
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please do not attach proprietary game files, credentials, or extracted assets.
  - type: input
    id: version
    attributes:
      label: ReMap version or commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target game
      options:
        - R5Reloaded
        - R5Flowstate
        - Not target-specific
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, Unity version when relevant, and any other useful details.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed credentials, personal data, game files, and extracted assets from the report.
          required: true
